[project]
name = "kbo-cli"
version = "0.3.0"
description = "KBO 야구 중계 CLI - 실시간 스코어, 문자중계, 순위, 박스스코어, 응원가"
readme = "README.md"
authors = [
    { name = "adminhelper", email = "201401339hs@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["kbo", "baseball", "cli", "tui", "korean-baseball", "rich", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "textual>=8.2.7",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/adminhelper/kbo-broadcast-cli"
Repository = "https://github.com/adminhelper/kbo-broadcast-cli"
Issues = "https://github.com/adminhelper/kbo-broadcast-cli/issues"

[project.scripts]
kbo = "kbo_cli.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kbo_cli*"]
